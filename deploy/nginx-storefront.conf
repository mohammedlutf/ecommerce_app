# Nginx site config for the react-native-web storefront.
#
# Two things this must get right that a plain SPA config usually does not:
#
#  1. **Per-route HTML.** `scripts/prerender.mjs` writes a real file per route
#     (`/ar/product/ABC-1/index.html`, not a single `index.html`). The SPA
#     fallback below is therefore only for URLs with no prerendered file, and
#     it must NOT be `try_files ... /index.html` at the root, or every
#     prerendered page would be served the empty shell and the whole SEO layer
#     would be dead on arrival.
#
#  2. **Locale-prefixed paths.** `/ar/...` and `/en/...` are real directories,
#     so no redirect gymnastics are needed; a missing `/index.html` falls back
#     to the SPA shell and the React Navigation linking config takes over.
#
# Install to /etc/nginx/sites-available/storefront and symlink into sites-enabled.

# Upstream Frappe/ERPNext (bench) — same host, different port.
upstream erpnext_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;   # TODO: replace with the real domain

    # ACME challenge for certificate renewal; must stay unauthenticated.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shop.example.com;   # TODO: replace with the real domain

    # TLS
    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Frappe backend -----------------------------------------------------
    #
    # Same-origin proxy so the browser never makes a cross-site request and no
    # CORS configuration is needed. `client_max_body_size` must cover order
    # uploads, not just page requests.
    client_max_body_size 20m;

    location ~ ^/(api|private/api|private/files|files)/ {
        proxy_pass         http://erpnext_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Frappe long-polls some endpoints; a short read timeout makes the UI
        # hang rather than fail.
        proxy_read_timeout 300s;
    }

    # ---- Static storefront --------------------------------------------------

    root /var/www/storefront;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/ld+xml;

    # Fingerprinted bundles are immutable.
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The OG image and favicon live at the web root via the project's public/.
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # sitemap.xml and robots.txt must be served as text, not sniffed.
    location = /sitemap.xml { add_header Content-Type "application/xml; charset=utf-8"; }
    location = /robots.txt  { add_header Content-Type "text/plain; charset=utf-8"; }

    # Pre-rendered routes win.
    #
    # `/en/product/X` -> try the directory index, then the SPA shell. Because
    # the prerenderer writes `index.html` inside each route directory, a real
    # page is found for every crawled URL.
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}